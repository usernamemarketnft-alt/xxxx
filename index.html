if(!Object.keys(EF).length)EF={'main.cpp':{l:'cpp',c:ST.cpp},'main.py':{l:'py',c:ST.py}};
let cf=ls('ecf');if(!EF[cf])cf=Object.keys(EF)[0];
const saveEF=()=>ls('efiles',JSON.stringify(EF));
function upd(){const v=$('#ec').value;EF[cf].c=v;drawG();hlDraw();acUpd();clearTimeout(tm);tm=setTimeout(saveEF,400);clearTimeout(lnT);lnT=setTimeout(runLint,v.length>20000?1200:450)}
function renderEd(){
$('#efl').innerHTML=Object.keys(EF).map(n=>`<option${n==cf?' selected':''}>${n}</option>`).join('');
LI=[];LC=null;buildTb();$('#ec').value=EF[cf].c;$('#eo').textContent='';document.documentElement.style.setProperty('--a',L[EF[cf].l].c);upd();ls('ecf',cf)}
$('#ec').oninput=upd;
$('#ec').onscroll=()=>{const e=$('#ec');$('#gt').scrollTop=e.scrollTop;$('#hl').scrollTop=e.scrollTop;$('#hl').scrollLeft=e.scrollLeft};
$('#ec').addEventListener('keydown',e=>{
const t=e.target,s=t.selectionStart,v=t.value;
const ins=x=>{e.preventDefault();t.setRangeText(x,s,t.selectionEnd,'end');upd()};
if(e.key=='Tab')ins('    ');
else if(e.key=='Enter'){const ln=v.slice(v.lastIndexOf('\n',s-1)+1,s);let ind=ln.match(/^\s*/)[0];if(/[:{]\s*$/.test(ln))ind+='    ';ins('\n'+ind)}});
$('#efl').onchange=()=>{cf=$('#efl').value;renderEd()};
function newF(l){
let n=prompt('اسم الملف (بدون امتداد)','prog'+(Object.keys(EF).length+1));if(!n)return;
n=n.replace(/\.(cpp|py)$/,'').replace(/[^\w\-]/g,'_')+(l=='py'?'.py':'.cpp');
if(EF[n]&&!confirm('الملف موجود، تستبدله؟'))return;
EF[n]={l,c:ST[l]};cf=n;saveEF();renderEd()}
$('#nc').onclick=()=>newF('cpp');$('#np').onclick=()=>newF('py');
$('#edl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([EF[cf].c],{type:'text/plain'}));a.download=cf;a.click()};
$('#edx').onclick=()=>{if(Object.keys(EF).length<2){alert('لازم يبقى ملف واحد على الأقل');return}if(confirm('حذف '+cf+'؟')){delete EF[cf];cf=Object.keys(EF)[0];saveEF();renderEd()}};
$('#er').onclick=async()=>{
const b=$('#er'),f=EF[cf];b.disabled=true;$('#eo').textContent='جاري التشغيل...';
try{const o=f.l=='py'?await runPy(f.c,$('#ei').value):await runCpp(f.c,$('#ei').value);$('#eo').textContent=o.trim()||'(ما طلع ناتج)'}
catch(e){$('#eo').textContent='تعذر التشغيل، تأكد من الإنترنت.'}b.disabled=false};
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=async()=>{
const k=b.dataset.e,f=EF[cf],n=f.l=='py'?'Python':'C++',o=$('#eo').textContent;let p;
if(k=='gen'){const d=prompt('شنو تريد الكود يسوي؟');if(!d)return;p='اكتب برنامج '+n+' كامل وجاهز للتشغيل يسوي: '+d+'\nاكتب الكود بكتلة واحدة ثم اشرحه بإيجاز.'}
else p='لغة '+n+'. هذا كودي:\n```\n'+f.c+'\n```\n'+(o?'ناتج التشغيل:\n'+o+'\n':'')+(LI.length?'أخطاء اكتشفها المحرر:\n'+LI.map(x=>'سطر '+x.ln+': '+x.msg).join('\n')+'\n':'')+{fix:'اكتشف الأخطاء واشرح السبب بإيجاز، واكتب النسخة الصحيحة كاملة بكتلة كود واحدة.',explain:'اشرح الكود سطر سطر بلهجة بسيطة.',improve:'حسّن الكود (وضوح، أخطاء محتملة، أداء) واكتب النسخة المحسنة كاملة بكتلة واحدة مع شرح التغييرات.'}[k];
const all=document.querySelectorAll('button');all.forEach(x=>x.disabled=true);$('#out').textContent='جاري التفكير...';$('#st').textContent='';
try{
const t=await gem(p,x=>{$('#out').innerHTML=md(x)});$('#out').innerHTML=md(t);$('#st').textContent='رد من المفتاح رقم '+used+' من '+keys().length+' ';
const m=t.match(/```\w*\n?([\s\S]*?)```/);
if(m){lastCode=m[1].trim()+'\n';const a=document.createElement('button');a.textContent='📥 حط الكود بالمحرر';a.onclick=()=>{EF[cf].c=lastCode;saveEF();renderEd();window.scrollTo(0,0)};$('#st').appendChild(a)}
}catch(e){$('#out').innerHTML='<span class="err">'+(e.message=='NOKEY'?'ما ضفت مفاتيح. اضغط ⚙ المفاتيح وحط مفتاح Gemini.':'كل المفاتيح فشلت (رمز: '+e.message.slice(4)+'). إذا 429 انتظر دقيقة أو ضيف مفتاح ثاني.')+'</span>'}
all.forEach(x=>x.disabled=false);$('#out').scrollIntoView({behavior:'smooth'})});
const KW={py:new Set('and as assert break class continue def del elif else except finally for from global if import in is lambda not or pass raise return try while with yield True False None self'.split(' ')),cpp:new Set('break case catch class const continue default delete do else enum for if namespace new private protected public return static struct switch template this throw try typedef using virtual while true false nullptr include define'.split(' '))};
const TY={py:new Set('print input len range int float str list dict set tuple open type sum min max sorted abs round enumerate zip map'.split(' ')),cpp:new Set('int double float char bool void long short unsigned signed string vector map set pair cout cin cerr endl size_t auto'.split(' '))};
const hlRe={
py:/(#.*)|("""[\s\S]*?(?:"""|(?![\s\S]))|'''[\s\S]*?(?:'''|(?![\s\S]))|[rbfRBF]{0,2}"(?:\\.|[^"\\\n])*"?|[rbfRBF]{0,2}'(?:\\.|[^'\\\n])*'?)|(\b\d+\.?\d*\b)|(\x00)|([A-Za-z_]\w*)/g,
cpp:/(\/\/.*|\/\*[\s\S]*?(?:\*\/|(?![\s\S])))|("(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(\b\d+\.?\d*\b)|(^[ \t]*#.*)|([A-Za-z_]\w*)/gm};
function hlHTML(code,l){
const re=hlRe[l],K=KW[l],T=TY[l];re.lastIndex=0;let out='',last=0,m;
while((m=re.exec(code))){
out+=esc(code.slice(last,m.index));const s=m[0];let c='';
if(m[1])c='c';else if(m[2])c='s';else if(m[3])c='n';else if(m[4])c='p';else if(K.has(s))c='k';else if(T.has(s))c='t';else if(code[m.index+s.length]=='(')c='f';
out+=c?'<span class="'+c+'">'+esc(s)+'</span>':esc(s);last=m.index+s.length;if(!s.length)re.lastIndex++}
return out+esc(code.slice(last))+'\n'}
function hlDraw(){$('#hl').innerHTML=hlHTML($('#ec').value,EF[cf].l)}
function acUpd(){
const t=$('#ec'),p=t.selectionStart,m=t.value.slice(0,p).match(/[A-Za-z_]\w*$/),box=$('#ac');
if(!m||m[0].length<2||t.selectionEnd!=p){box.innerHTML='';return}
const pre=m[0],l=EF[cf].l,seen=new Set();
[...KW[l],...TY[l],...new Set(t.value.match(/[A-Za-z_]\w*/g)||[])].forEach(w=>{if(w.length>pre.length&&w.startsWith(pre))seen.add(w)});
box.innerHTML='';
[...seen].sort((x,y)=>x.length-y.length).slice(0,8).forEach(w=>{const b=document.createElement('button');b.textContent=w;b.onclick=()=>{t.setRangeText(w,p-pre.length,p,'end');upd();t.focus()};box.appendChild(b)})}
const SY=[['⇥','    |'],['()','(|)'],['{}','{|}'],['[]','[|]'],['""','"|"'],["''","'|'"]].concat(';:<>=+-*/%&#!,.'.split('').map(c=>[c,c]));
const SN={cpp:[['for','for (int i = 0; i < |; i++) {\n    \n}'],['if','if (|) {\n    \n}'],['while','while (|) {\n    \n}'],['cout','cout << | << endl;'],['cin','cin >> |;'],['main','int main() {\n    |\n    return 0;\n}'],['#inc','#include <|>']],py:[['for','for i in range(|):\n    '],['if','if |:\n    '],['elif','elif |:\n    '],['while','while |:\n    '],['def','def |():\n    '],['print','print(|)'],['input','input(|)'],['try','try:\n    |\nexcept Exception as e:\n    print(e)']]};
function snip(tpl){
const t=$('#ec'),s=t.selectionStart,v=t.value,a=v.lastIndexOf('\n',s-1)+1,ind=v.slice(a,s).match(/^\s*/)[0];
let x=tpl.split('\n').join('\n'+ind);const k=x.indexOf('|');x=x.replace('|','');
t.setRangeText(x,s,t.selectionEnd,'end');if(k>=0)t.setSelectionRange(s+k,s+k);upd();t.focus()}
function buildTb(){const box=$('#tb');box.innerHTML='';[...SN[EF[cf].l],...SY].forEach(([a,b])=>{const x=document.createElement('button');x.textContent=a;x.onclick=()=>snip(b);box.appendChild(x)})}
$('#tb').addEventListener('pointerdown',e=>e.preventDefault());
$('#ac').addEventListener('pointerdown',e=>e.preventDefault());
document.addEventListener('selectionchange',()=>{if(document.activeElement==$('#ec'))acUpd()});
let EXC=null;
const exk=()=>'x:'+lang+cur;
function showEx(){$('#exq').innerHTML=EXC?'<h4>'+esc(EXC.title)+'</h4>'+md(EXC.statement):'';$('#exr').innerHTML=''}
function loadEx(){try{EXC=JSON.parse(ls(exk())||'null')}catch(e){EXC=null}showEx()}
function prog(){const dn=L[lang].d.map((_,i)=>done[lang+i]).filter(Boolean).length;$('#pb').style.width=dn*5+'%';$('#pc').textContent='أنجزت '+dn+' من 20 درس';const g=$('#g').children[cur];if(g)g.classList.add('d');$('#dn').textContent='ملغي الإنجاز'}
$('#gx').onclick=async()=>{
if(EXC&&!confirm('عندك تمرين محفوظ لهذا الدرس. تريد تمرين جديد؟')){$('#lc').value=EXC.starter||'';return}
const b=$('#gx'),d=L[lang].d[cur];b.disabled=true;$('#exq').textContent='جاري تجهيز التمرين...';$('#exr').innerHTML='';
const p='سوي تمرين برمجي صغير على هذا الدرس بلغة '+L[lang].n+' (الدرس: '+d[0]+'). البرنامج يقرأ من الإدخال القياسي (stdin) ويطبع النتيجة فقط بدون أي نص ترحيبي أو رسائل طلب إدخال. ارجع JSON فقط بدون ``` وبهذا الشكل: {"title":"عنوان","statement":"شرح التمرين بالعربي مع وصف الإدخال والإخراج","starter":"كود بداية قصير","tests":[{"in":"المدخلات كل قيمة بسطر، أو فارغة إذا ما كو","out":"المخرجات المتوقعة بالضبط"}]} وحط 3 حالات اختبار محسوبة بدقة، بدون عشوائية أو وقت.';
try{const t=await gem(p,null,[],ctx()),j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));if(!j.tests||!j.tests.length)throw 0;EXC=j;ls(exk(),JSON.stringify(j));showEx();$('#lc').value=j.starter||'';$('#ro').textContent=''}
catch(e){EXC=null;$('#exq').innerHTML='<span class="err">'+(e&&e.message?EMSG(e):'ما قدرت أجهز التمرين، جرب مرة ثانية.')+'</span>'}
b.disabled=false};
$('#gc').onclick=async()=>{
if(!EXC){$('#exr').textContent='اضغط «تمرين مصحَّح» أول.';return}
const b=$('#gc'),code=$('#lc').value,nm=s=>String(s||'').trim().split(/\s+/).join(' ');
b.disabled=true;$('#exr').textContent='جاري التصحيح...';
try{
const rs=[];
if(lang=='py'){for(const t of EXC.tests)rs.push(await runPy(code,t.in||''))}
else rs.push(...await Promise.all(EXC.tests.map(t=>runCpp(code,t.in||''))));
let ok=0;
const h=EXC.tests.map((t,i)=>{const g=rs[i],p=nm(g)==nm(t.out);if(p)ok++;return '<div class="tr '+(p?'ok':'err')+'">'+(p?'✓':'✗')+' حالة '+(i+1)+(p?'':'<pre>مدخلات: '+esc(t.in||'(لا شي)')+'\nالمتوقع: '+esc(t.out)+'\nطلع: '+esc(g.trim()||'(لا شي)')+'</pre>')+'</div>'}).join('');
const all=ok==EXC.tests.length;
$('#exr').innerHTML='<b>'+ok+' من '+EXC.tests.length+' حالات نجحت</b>'+h+(all?'<div class="ok">🎉 ممتاز! انحسب الدرس منجز.</div>':'<div class="row"><button id="fx">اشرحلي شنو الغلط</button></div>');
if(all){done[lang+cur]=true;ls('done',JSON.stringify(done));prog()}
}catch(e){$('#exr').textContent='تعذر التصحيح، تأكد من الإنترنت.'}
b.disabled=false};
$('#exr').onclick=async e=>{
if(e.target.id!='fx')return;
const p='التمرين: '+EXC.statement+'\nهذا حلي:\n```\n'+$('#lc').value+'\n```\nنتائج الاختبار:\n'+$('#exr').innerText+'\nاشرح شنو الغلط بتلميحات فقط، بدون ما تعطيني الحل كامل.';
$('#out').textContent='جاري التفكير...';
try{await gem(p,t=>{$('#out').innerHTML=md(t)},[],ctx());$('#out').scrollIntoView({behavior:'smooth'})}catch(x){$('#out').innerHTML='<span class="err">'+EMSG(x)+'</span>'}};
$('#cc').title='يمسح سياق محادثة هذا الدرس';
let ip;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#ins').hidden=false});
$('#ins').onclick=async()=>{if(ip){ip.prompt();ip=null;$('#ins').hidden=true}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
